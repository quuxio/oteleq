name: Native lifetime workflow qualification

on:
  pull_request:
    paths:
      - '.github/workflows/native-lifetimes.yml'
      - 'tests/qualify_native_lifetimes.py'
      - 'tests/native_lifetime_audit.py'
      - 'tests/native_lifetime_cases.py'
      - 'tests/native_lifetime_otlp.py'
      - 'tests/native_lifetime_refusals.py'
      - 'tests/native_prepared_otlp.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-lifetimes:
    name: native-lifetimes (${{ matrix.case }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [cpp-target-error, c-completed, cpp-completed, c-state, c-zero, cpp-zero, c-censored, cpp-censored, cpp-unwind, cpp-throwing-destructor]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CC: /usr/lib/llvm-22/bin/clang
      CXX: /usr/lib/llvm-22/bin/clang++
      OTELC_LLVM_BIN: /usr/lib/llvm-22/bin
      LLVM_CONFIG: /usr/lib/llvm-22/bin/llvm-config
      OTELC_CLANG: /usr/lib/llvm-22/bin/clang
      OTELC_CLANGXX: /usr/lib/llvm-22/bin/clang++
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: consumer
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quuxio/otelc
          ref: acb13d7735526448209df37b7e6b98e5717befdb
          path: provider
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install matched LLVM 22 tools
        run: |
          bash provider/ci/install_llvm22.sh
          sudo apt-get install --yes --no-install-recommends clang-tools-22
      - name: Install locked decoder and validation tools
        working-directory: consumer
        run: 'python -m pip install --require-hashes --only-binary=:all: -r ci/requirements.txt'
      - name: Build the pinned consumer
        working-directory: consumer
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          cargo build --locked
      - name: Build original SDK and exercise public lifetime workflows
        run: |
          python consumer/tests/qualify_native_lifetimes.py \
            --otelc-root "$GITHUB_WORKSPACE/provider" \
            --sdk-build "$RUNNER_TEMP/native-lifetime-sdk" \
            --report-dir "$RUNNER_TEMP/native-lifetime-evidence" \
            --cli "$GITHUB_WORKSPACE/consumer/target/debug/quux-oteleq" \
            --case '${{ matrix.case }}'
      - name: Retain exact source archives and source status
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/native-lifetime-evidence"
          if test -f consumer/target/debug/quux-oteleq; then
            cp consumer/target/debug/quux-oteleq "$RUNNER_TEMP/native-lifetime-evidence/consumer-cli"
          fi
          git -C consumer archive --format=tar --output "$RUNNER_TEMP/native-lifetime-evidence/consumer-source.tar" HEAD
          git -C provider archive --format=tar --output "$RUNNER_TEMP/native-lifetime-evidence/provider-source.tar" HEAD
          git -C consumer status --porcelain > "$RUNNER_TEMP/native-lifetime-evidence/consumer-source-status.txt"
          git -C provider status --porcelain > "$RUNNER_TEMP/native-lifetime-evidence/provider-source-status.txt"
          test -z "$(git -C consumer status --porcelain)"
          test -z "$(git -C provider status --porcelain)"
      - name: Compress and verify all terminal qualification and SDK outputs
        if: ${{ always() && !cancelled() }}
        working-directory: consumer
        run: |
          mkdir -m 700 "$RUNNER_TEMP/native-lifetime-compressed"
          python -m ci.qualification_bundle pack \
            --root "$RUNNER_TEMP/native-lifetime-evidence" \
            --store "$RUNNER_TEMP/native-lifetime-compressed/evidence" \
            --confirm-cold --remove-raw
          if test -d "$RUNNER_TEMP/native-lifetime-sdk"; then
            python -m ci.qualification_bundle pack \
              --root "$RUNNER_TEMP/native-lifetime-sdk" \
              --store "$RUNNER_TEMP/native-lifetime-compressed/sdk" \
              --confirm-cold --remove-raw
          fi
      - name: Retain original qualification evidence and SDK build failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: native-lifetimes-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-lifetime-compressed/
            ${{ runner.temp }}/native-lifetime-evidence/
            ${{ runner.temp }}/native-lifetime-sdk/
          compression-level: 9
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
