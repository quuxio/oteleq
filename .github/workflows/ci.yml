name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['.badges/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  design:
    name: Documentation and design examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install pinned Rust for worker regressions
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install locked documentation tools
        run: make setup
      - name: Install matched native observer and project frontend tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 clang-tools-18 llvm-18-dev libclang-18-dev libclang-cpp18-dev
      - name: Install pinned observer coverage tool
        run: 'python -m pip install --only-binary=:all: coverage==7.16.2'
      - name: Validate documents and example syntax
        run: make docs-check
        env:
          OTELC_CLANG: /usr/bin/clang-18
          OTELC_CLANGXX: /usr/bin/clang++-18

  core:
    name: Rust comparator and 80% product coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          rustup default 1.98.1
      - name: Cache pinned coverage executable
        id: coverage-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-${{ runner.arch }}-rust-1.98.1-tool-0.8.7
      - name: Install pinned coverage tool
        if: steps.coverage-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Verify pinned coverage tool
        run: test "$(cargo llvm-cov --version)" = 'cargo-llvm-cov 0.8.7'
      - name: Validate comparator and coverage
        run: make core-check coverage
