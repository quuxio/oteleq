name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['.badges/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  design:
    name: Documentation and design examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - name: Install locked documentation tools
        run: make setup
      - name: Install pinned observer coverage tool
        run: python -m pip install coverage==7.16.2
      - name: Validate documents and example syntax
        run: make docs-check

  core:
    name: Rust comparator and 80% product coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install pinned Rust and coverage tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          rustup default 1.98.1
          cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Validate comparator and coverage
        run: make core-check coverage
