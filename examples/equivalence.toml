# Executable policy for quux-oteleq plan --config.
# Build recipes, object factories and sequences remain on the completion checklist.
schema_version = 1
languages = ["c", "cpp", "rust", "python", "java", "javascript", "typescript", "go"]

[sources]
include = ["**"]
exclude = []

[functions]
include = ["*"]
exclude = []

[generation]
seed = 20261008
cases_per_function = 16

[limits]
case_timeout_ms = 60000
baseline_repeats = 2
instrumented_repeats = 2
max_capture_bytes = 262144

# Frozen provider selection. llvm requires its own matched compiler/SDK/pass profile.
[adapters.rust]
backend = "compiler"

# Opt into ordinary Go package/type context with explicit source-relative module roots.
# Empty roots retain standalone file mode. Tags require module roots.
[adapters.go]
module_roots = []
build_tags = []

# Optional explicit domain cases replace automatic samples for matching functions.
# Use the exact function identity from plan.json or a deliberate glob.
# [[fixtures]]
# language = "python"
# source = "src/api.py"
# function = "src.api.calculate"
# cases = [[7], [41]]
# Explicit independent domains are required to enable scalar shrinking.
# domains = [{ kind = "integer", minimum = 0, maximum = 100 }]
# Intentional errors require an explicit contract; otherwise a return is required.
# expected_baseline = { kind = "error", category = "exception", type = "python.builtins.ValueError" }
# Or declare a known scalar result. Use cases=[[7]] when the known result is 8:
# expected_baseline = { kind = "return_value", value = { kind = "integer", type = "python.int", value = "8", signed = true } }
